name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore MFilesClone.sln

      - name: Build
        run: dotnet build MFilesClone.sln --no-restore --configuration Release

      - name: Publish MFilesClone.Server
        run: dotnet publish src/MFilesClone.Server/MFilesClone.Server.csproj -c Release -o publish/MFilesClone.Server

      - name: Upload MFilesClone.Server artifact
        uses: actions/upload-artifact@v4
        with:
          name: MFilesCloneServer
          path: publish/MFilesClone.Server

  installer:
    needs: build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish MFilesClone
        run: dotnet publish src/MFilesClone/MFilesClone.csproj -c Release -r win-x64 --self-contained true -o publish/MFilesClone

      - name: Publish MFilesClone.ShellExtension
        run: dotnet publish src/MFilesClone.ShellExtension/MFilesClone.ShellExtension.csproj -c Release -r win-x64 --self-contained true -o publish/MFilesClone

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\Setup.iss'
        shell: pwsh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MFilesCloneSetup
          path: installer/Output/MFilesCloneSetup.exe
